---
# Omarchy Workstation Playbook
# Targets Omarchy 4 ("Quattro"). bootstrap.sh refuses to run on older releases.
#
# Layers on top of Omarchy — never modifies Omarchy's own files. On Quattro
# those live in /usr/share/omarchy (pacman-owned), with ~/.local/share/omarchy
# kept as a compatibility symlink.
#
# Usage examples:
#   ./bootstrap.sh                                 # Run everything
#   ansible-playbook playbook.yml --tags zsh       # Run only zsh role
#   ansible-playbook playbook.yml --tags "zsh,go"  # Run multiple
#   ansible-playbook playbook.yml --skip-tags packages

- hosts: workstation
  become: true
  vars_files:
    - config.yml

  pre_tasks:
    - name: Read installed Omarchy version
      ansible.builtin.command: omarchy version
      register: omarchy_version
      changed_when: false
      check_mode: false
      become: false
      tags: [always]

    - name: Require Omarchy 4
      ansible.builtin.assert:
        that: omarchy_version.stdout is match('^4\.')
        fail_msg: "This collection targets a stock Omarchy 4 installation."
      tags: [always]

  roles:
    # Core packages (your additions on top of Omarchy)
    - { role: pacman, tags: ["pacman", "packages"] }
    - { role: aur, tags: ["aur", "packages"] }
    - { role: aur_packages, tags: ["aur-packages", "packages"] }

    # Shell (installs zsh + oh-my-zsh + p10k — does NOT chsh)
    - { role: zsh, tags: ["zsh", "shell"] }

    # System services
    - { role: firewall, tags: ["firewall", "ufw", "network"] }
    - { role: wireguard, tags: ["wireguard", "vpn"] }
    - { role: tor_proxy, tags: ["tor_proxy", "network"] }

    # AI Tools
    #- { role: agents, tags: ["agents", "ai"] }
    #- { role: skills, tags: ["skills", "ai"] }

    # Utility (dotfiles, folders, extra links)
    - { role: folders, tags: ["folders"] }
    - { role: dotfiles, tags: ["dotfiles"] }
    - { role: links, tags: ["links"] }
    - { role: desktop, tags: ["desktop", "theme"], when: configure_desktop | default(true) | bool }
